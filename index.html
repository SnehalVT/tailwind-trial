<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelancer</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  
  <body class="font-sans">
    
  <!-- Nav -->
  <nav class="bg-gray-800 text-white px-8 py-4 flex justify-between">
    <h1 class="font-bold text-lg">START BOOTSTRAP</h1>
    <ul class="flex gap-6 text-sm">
      <li>PORTFOLIO</li>
      <li>ABOUT</li>
      <li>CONTACT</li>
    </ul>
  </nav>

  <!-- Main -->
  <section class="bg-teal-500 text-white text-center py-20">
    <img src="https://startbootstrap.github.io/startbootstrap-freelancer/assets/img/avataaars.svg"
         class="w-32 mx-auto mb-6">

    <h1 class="text-4xl font-bold mb-4">START BOOTSTRAP</h1>

    <div class="flex justify-center items-center gap-3 mb-4">
      <div class="w-16 h-1 bg-white"></div>
      <span>★</span>
      <div class="w-16 h-1 bg-white"></div>
    </div>

    <p>Graphic Artist - Web Designer - Illustrator</p>
  </section>

  <!-- PORTFOLIO -->
  <section class="py-16 text-center">
    <h2 class="text-3xl font-bold mb-8">PORTFOLIO</h2>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 px-10">
      <div class="bg-gray-200 h-40"></div>
      <div class="bg-gray-200 h-40"></div>
      <div class="bg-gray-200 h-40"></div>
      <div class="bg-gray-200 h-40"></div>
      <div class="bg-gray-200 h-40"></div>
      <div class="bg-gray-200 h-40"></div>
    </div>
  </section>

  <!-- ABOUT -->
  <section class="bg-teal-500 text-white text-center py-16 px-10">
    <h2 class="text-3xl font-bold mb-6">ABOUT</h2>

    <div class="text-center py-16 px-10">
      <p>
        This is a simple website created using Tailwind. A lot left to stduy.
      </p>
    </div>
  </section>

  <!-- CONTACT -->
  <section class="py-16 text-center">
    <h2 class="text-3xl font-bold mb-6">CONTACT ME</h2>

    <form class="max-w-md mx-auto space-y-4">
      <input type="text" placeholder="Name"
        class="w-full border p-2">

      <input type="email" placeholder="Email"
        class="w-full border p-2">

      <textarea placeholder="Message"
        class="w-full border p-2"></textarea>

      <button class="bg-teal-500 text-white px-6 py-2">
        Send
      </button>
    </form>
  </section>

  <!-- FOOTER -->
  <footer class="bg-gray-800 text-white text-center py-6">
    <p>© My Website 2026</p>
  </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
